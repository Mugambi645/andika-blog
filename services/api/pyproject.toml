[project]
name = "andika-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<5.1",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.1",
    "django-environ>=0.11",
    "drf-spectacular>=0.27",
    "celery[redis]>=5.4",
    "django-redis>=5.4",
    "django-filter>=24.2",
    "djangorestframework-simplejwt>=5.3",
    "markdown>=3.6",
    "pillow>=10.3",
    "structlog>=24.1",
    "pytest-django>=4.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-django>=4.8",
    "factory-boy>=3.3",
]
